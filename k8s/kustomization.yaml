# The notebooks site on the Sustenaut k3s server (shared-infra's infra/hetzner.tf), namespace
# notebooks: the app (marimo, behind the access check), oauth2-proxy in front of it and the
# ingress for notebooks.sustenaut.eu.
# Rendered by .github/workflows/deploy.yml with the image it just built
# (kustomize edit set image) and applied by sustenaut-deploy on the server.
# Not here: the Secrets notebooks-secrets and notebooks-oidc (the sign-in client) and
# the network policy in admin/ (the deploy identity may not manage those), which the
# deploy walk puts in (pubkit.json's deploy block, README.md, "Deploying").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notebooks
resources:
  - service-accounts.yaml
  - app.yaml
  - oauth2-proxy.yaml
  - ingress.yaml
images:
  - name: ghcr.io/sustenaut/notebooks
    newTag: unset
