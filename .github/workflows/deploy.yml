# Build and deploy the notebooks site (notebooks.sustenaut.eu) once CI passes on a merge
# to main, or by hand, with pubkit's k8s-deploy.yml (pubkit's README, "Deploying a
# service to k3s"). The image goes to GitHub's container registry and holds the
# notebooks, their queries and forms and the widget's bundle: no key, no token and no
# data (the BigQuery key is mounted on the server, k8s/app.yaml). Then the manifests in
# k8s/, rendered with that image, go to the Sustenaut k3s server (shared-infra's
# infra/hetzner.tf) over SSH and the tailnet, where the deploy key can only run
# sustenaut-deploy: apply in namespace notebooks and wait, once DEPLOY_NOTEBOOKS is on,
# which the deploy walk sets once every need before it is ready.
#
# Without SUSTENAUT_SERVER the image is built and pushed, and nothing is deployed.
name: deploy

on:
  # Once CI (main.yml) has passed on a merge to main, never beside it; k8s-deploy's
  # ready job also waits for the integrations check on that commit.
  workflow_run: { workflows: [main], types: [completed], branches: [main] }
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  deploy:
    uses: Sustenaut/pubdeploy/.github/workflows/k8s-deploy.yml@2df756eb5916723abb2d9fac9e3fd58e67693877 # v0.2.0
    with:
      image: ghcr.io/sustenaut/notebooks
      deploys: |
        k8s notebooks DEPLOY_NOTEBOOKS
      # The image must start as its own user, hold what the site imports and the widget's
      # bundle, refuse to serve without the sign-in client, and hold no samples or tests.
      check: |
        docker run --rm "$IMAGE" sh -c 'test "$(id -u)" = 1000 && python -c "
        import pathlib, notebooks_lib.serve as serve, notebooks_lib.widget as widget
        assert widget.BUNDLE.exists()
        assert serve.notebook_paths()
        assert not pathlib.Path(\"samples\").exists() and not pathlib.Path(\"tests\").exists()
        try:
            serve.from_environment()
        except RuntimeError:
            pass
        else:
            raise SystemExit(\"served without a sign-in client\")
        "'
    secrets: inherit
